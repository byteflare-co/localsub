name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests and app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test
        run: swift test --scratch-path /tmp/localsub-ci-tests
      - name: Build app bundle
        run: ./scripts/build-app.sh release
